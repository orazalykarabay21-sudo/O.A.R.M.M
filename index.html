<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Make More - O.A.R.M.M [ТАБЛИЦА ЛИДЕРОВ]</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0f, #1a1a2e, #0f0f1a);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }

        .game-container {
            background: rgba(10, 10, 20, 0.5);
            border-radius: 40px;
            padding: 15px;
            backdrop-filter: blur(8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 650px;
        }

        .game {
            width: 100%;
            background: linear-gradient(135deg, rgba(20,20,35,0.96), rgba(15,15,25,0.98));
            border-radius: 35px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            text-align: center;
            border: 1px solid rgba(255,215,0,0.15);
        }

        .hard-mode-badge {
            background: linear-gradient(135deg, #FF0000, #8B0000);
            color: white;
            padding: 6px 15px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 1.8em;
            background: linear-gradient(135deg, #FFD700, #FFA500, #FF6347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .sub {
            color: #888;
            margin-bottom: 15px;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        .balance {
            background: linear-gradient(135deg, #1a1a2a, #0f0f1a);
            border-radius: 60px;
            padding: 12px 20px;
            margin-bottom: 15px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.4), 0 5px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,215,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .balance::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,215,0,0.05) 0%, transparent 70%);
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .balance-label {
            font-size: 0.8rem;
            color: #FFD700;
            letter-spacing: 2px;
            font-weight: bold;
            position: relative;
            z-index: 1;
        }

        .balance-amount {
            font-size: 2.8rem;
            font-weight: bold;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            position: relative;
            z-index: 1;
            font-family: 'Monaco', monospace;
        }

        .click-area {
            margin: 15px 0;
        }

        .main-button {
            width: 160px;
            height: 160px;
            background: radial-gradient(circle at 30% 30%, #FFD700, #FF8C00);
            border: none;
            border-radius: 50%;
            font-size: 3rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 12px 0 #B8860B, 0 8px 25px rgba(0,0,0,0.4);
            transition: 0.05s linear;
            margin: 10px auto;
            display: block;
            font-family: monospace;
            position: relative;
            overflow: hidden;
        }

        .main-button:active {
            transform: translateY(6px);
            box-shadow: 0 6px 0 #B8860B;
        }

        .per-click {
            background: linear-gradient(135deg, #2a2a35, #1e1e28);
            padding: 8px;
            border-radius: 40px;
            margin-top: 8px;
            font-size: 0.9rem;
            color: #FFD700;
            font-weight: bold;
            border: 1px solid rgba(255,215,0,0.2);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 15px 0;
        }

        .stat-card {
            background: linear-gradient(135deg, #1a1a24, #12121a);
            padding: 8px;
            border-radius: 15px;
            border: 1px solid rgba(255,215,0,0.15);
        }

        .stat-label {
            font-size: 0.6rem;
            color: #aaa;
            margin-bottom: 3px;
        }

        .stat-value {
            font-size: 0.9rem;
            font-weight: bold;
            color: #FFD700;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        .leaderboard-btn {
            background: linear-gradient(135deg, #FF8C00, #FF5722);
            padding: 10px;
            border: none;
            border-radius: 35px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .leaderboard-btn:active {
            transform: scale(0.98);
        }

        .upgrades {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .upgrades::-webkit-scrollbar {
            width: 4px;
        }

        .upgrades::-webkit-scrollbar-track {
            background: #1a1a24;
            border-radius: 10px;
        }

        .upgrades::-webkit-scrollbar-thumb {
            background: #FFD700;
            border-radius: 10px;
        }

        .upgrade {
            background: linear-gradient(135deg, #1a1a28, #12121e);
            border-radius: 18px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,215,0,0.15);
            gap: 8px;
            flex-wrap: wrap;
            position: relative;
        }

        .upgrade.max-level {
            border: 2px solid #FFD700;
            background: linear-gradient(135deg, #2a2a38, #1a1a2a);
            opacity: 0.95;
        }

        .upgrade.max-level::after {
            content: '👑 MAX';
            position: absolute;
            top: -8px;
            right: 10px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1a1a2e;
            font-size: 0.6rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 20px;
            z-index: 1;
        }

        .upgrade-info {
            text-align: left;
            flex: 2;
            min-width: 120px;
        }

        .upgrade-name {
            font-weight: bold;
            font-size: 0.9rem;
            color: #FFD700;
        }

        .upgrade-desc {
            font-size: 0.65rem;
            color: #aaa;
        }

        .upgrade-stats {
            font-size: 0.7rem;
            color: #FFA500;
        }

        .upgrade-stats.diminishing {
            color: #FF6666;
        }

        .upgrade-cost {
            background: linear-gradient(135deg, #8B0000, #CC0000);
            padding: 6px 12px;
            border-radius: 25px;
            font-weight: bold;
            color: #FFD700;
            font-size: 0.8rem;
            min-width: 75px;
            text-align: center;
        }

        .buy-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border: none;
            color: white;
            padding: 6px 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.1s ease;
            font-size: 0.8rem;
            min-width: 70px;
        }

        .buy-btn:active {
            transform: scale(0.95);
        }

        .buy-btn.disabled {
            background: linear-gradient(135deg, #555, #444);
            opacity: 0.5;
            cursor: not-allowed;
        }

        .buy-btn.maxed {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1a1a2e;
            cursor: default;
            opacity: 0.8;
        }

        .save-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .save-btn {
            background: linear-gradient(135deg, #2c5f8a, #1a3a5c);
            padding: 10px;
            border: none;
            border-radius: 35px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .save-btn:active {
            transform: scale(0.98);
        }

        .reset-btn {
            background: linear-gradient(135deg, #8b3c3c, #6b2c2c);
            padding: 10px;
            border: none;
            border-radius: 35px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        /* Модальное окно лидеров */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border-radius: 30px;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 80%;
            overflow-y: auto;
            border: 2px solid #FFD700;
            box-shadow: 0 0 30px rgba(255,215,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #FFD700;
        }

        .modal-header h2 {
            color: #FFD700;
            margin: 0;
            font-size: 1.5rem;
        }

        .close-modal {
            background: #FF4444;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .leaderboard-item {
            background: linear-gradient(135deg, #1a1a28, #12121e);
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,215,0,0.2);
        }

        .leaderboard-item.top1 {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1a1a2e;
        }

        .leaderboard-item.top1 .rank, 
        .leaderboard-item.top1 .player-name,
        .leaderboard-item.top1 .player-money {
            color: #1a1a2e;
            font-weight: bold;
        }

        .leaderboard-item.top2 {
            background: linear-gradient(135deg, #C0C0C0, #A0A0A0);
        }

        .leaderboard-item.top3 {
            background: linear-gradient(135deg, #CD7F32, #B8860B);
        }

        .rank {
            font-size: 1.3rem;
            font-weight: bold;
            width: 50px;
        }

        .player-name {
            flex: 2;
            font-weight: bold;
            font-size: 1rem;
        }

        .player-money {
            font-weight: bold;
            font-family: monospace;
            color: #FFD700;
        }

        .current-player {
            background: linear-gradient(135deg, #2a5f8a, #1a3a5c);
            border: 2px solid #FFD700;
        }

        .update-leaderboard {
            font-size: 0.7rem;
            color: #aaa;
            text-align: center;
            margin-top: 15px;
        }

        .info-text {
            font-size: 0.65rem;
            color: #FFA500;
            margin-top: 10px;
            text-align: center;
            background: rgba(0,0,0,0.3);
            padding: 5px;
            border-radius: 20px;
        }

        @keyframes float {
            0% { opacity: 1; transform: translateY(0px) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.1); }
        }

        .floating-number {
            position: fixed;
            pointer-events: none;
            font-weight: bold;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 1000;
            animation: float 0.7s ease-out forwards;
            font-family: monospace;
        }

        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .shake {
            animation: shakeAnim 0.15s ease-in-out;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1a1a2e;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.8rem;
            animation: slideInRight 0.3s ease-out, fadeOut 0.3s ease-out 2.5s forwards;
            z-index: 1000;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        @media (max-width: 550px) {
            .game {
                padding: 15px;
            }
            
            .main-button {
                width: 130px;
                height: 130px;
                font-size: 2.5rem;
            }
            
            .balance-amount {
                font-size: 2.2rem;
            }
            
            .upgrade {
                padding: 8px 10px;
            }
            
            .upgrade-cost {
                font-size: 0.7rem;
                padding: 4px 8px;
                min-width: 65px;
            }
            
            .buy-btn {
                padding: 5px 12px;
                font-size: 0.7rem;
                min-width: 60px;
            }
            
            .stats {
                grid-template-columns: repeat(4, 1fr);
                gap: 5px;
            }
            
            .stat-value {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game">
        <div class="hard-mode-badge">⚠️ ТАБЛИЦА ЛИДЕРОВ ⚠️</div>
        <h1>💰 O.A.R.M.M 💰</h1>
        <div class="sub">соревнуйся с другими игроками!</div>

        <div class="balance">
            <div class="balance-label">💰 КАПИТАЛ 💰</div>
            <div class="balance-amount" id="balance">0</div>
        </div>

        <div class="click-area">
            <button class="main-button" id="clickBtn">💎</button>
            <div class="per-click">
                ⚡ +<span id="perClick">1</span> за клик
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">КЛИКИ</div>
                <div class="stat-value" id="totalClicks">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">АВТО/СЕК</div>
                <div class="stat-value" id="autoIncome">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">ПРОГРЕСС</div>
                <div class="stat-value" id="progressPercent">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">МЕСТО</div>
                <div class="stat-value" id="playerRank">-</div>
            </div>
        </div>

        <div class="button-row">
            <button class="leaderboard-btn" id="leaderboardBtn">🏆 ТАБЛИЦА ЛИДЕРОВ 🏆</button>
        </div>

        <div class="upgrades" id="upgradesList"></div>

        <div class="save-controls">
            <button class="save-btn" id="saveBtn">💾 СОХРАНИТЬ</button>
            <button class="save-btn" id="loadBtn">📂 ЗАГРУЗИТЬ</button>
            <button class="reset-btn" id="resetBtn">🔄 СБРОС</button>
        </div>
        <div class="info-text">
            👥 Ваши данные сохраняются в таблицу лидеров! Соревнуйтесь с другими!
        </div>
    </div>
</div>

<!-- Модальное окно таблицы лидеров -->
<div id="leaderboardModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>🏆 ТАБЛИЦА ЛИДЕРОВ 🏆</h2>
            <button class="close-modal" onclick="closeLeaderboard()">✕</button>
        </div>
        <div id="leaderboardList" class="leaderboard-list">
            <!-- Список лидеров будет загружаться сюда -->
        </div>
        <div class="update-leaderboard" id="updateInfo">
            Обновлено: --
        </div>
    </div>
</div>

<script>
    // ИГРОВЫЕ ДАННЫЕ
    let money = 0;
    let clickPower = 1;
    let totalClicks = 0;
    let playerName = '';
    let playerId = '';

    // Генерация уникального ID игрока
    function generatePlayerId() {
        let id = localStorage.getItem('playerId');
        if (!id) {
            id = 'player_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('playerId', id);
        }
        return id;
    }

    // Получение имени игрока
    function getPlayerName() {
        let name = localStorage.getItem('playerName');
        if (!name) {
            name = prompt('Введите ваше имя для таблицы лидеров:', 'Игрок_' + Math.floor(Math.random() * 1000));
            if (!name) name = 'Аноним';
            localStorage.setItem('playerName', name);
        }
        return name;
    }

    playerId = generatePlayerId();
    playerName = getPlayerName();

    const DIMINISH_START = 5;

    // Работники
    const upgrades = [
        { id: 'click1', name: 'Максим', desc: '+5 к клику', type: 'click', baseCost: 1000, basePower: 5, maxLevel: 10, emoji: '🤝', count: 0,
          currentPower: function() { return getActualPower(this.basePower, this.count, this.maxLevel); } },
        { id: 'click2', name: 'Родион', desc: '+15 к клику', type: 'click', baseCost: 5000, basePower: 15, maxLevel: 9, emoji: '⚡', count: 0,
          currentPower: function() { return getActualPower(this.basePower, this.count, this.maxLevel); } },
        { id: 'click3', name: 'Миша', desc: '+40 к клику', type: 'click', baseCost: 15000, basePower: 40, maxLevel: 8, emoji: '🚀', count: 0,
          currentPower: function() { return getActualPower(this.basePower, this.count, this.maxLevel); } },
        { id: 'click4', name: 'Супер-Миша', desc: '+100 к клику', type: 'click', baseCost: 25000, basePower: 100, maxLevel: 7, emoji: '💎', count: 0,
          currentPower: function() { return getActualPower(this.basePower, this.count, this.maxLevel); } },
        { id: 'auto1', name: 'Адиль', desc: '+25/сек', type: 'auto', baseCost: 8000, basePower: 25, maxLevel: 9, emoji: '📀', count: 0,
          currentPower: function() { return getActualPower(this.basePower, this.count, this.maxLevel); } },
        { id: 'auto2', name: 'Супер-Адиль', desc: '+60/сек', type: 'auto', baseCost: 20000, basePower: 60, maxLevel: 8, emoji: '💿', count: 0,
          currentPower: function() { return getActualPower(this.basePower, this.count, this.maxLevel); } },
        { id: 'auto3', name: 'Ораз', desc: '+100/сек', type: 'auto', baseCost: 50000, basePower: 100, maxLevel: 8, emoji: '🏭', count: 0,
          currentPower: function() { return getActualPower(this.basePower, this.count, this.maxLevel); } },
        { id: 'auto4', name: 'Супер-Ораз', desc: '+200/сек', type: 'auto', baseCost: 100000, basePower: 200, maxLevel: 7, emoji: '🏭💎', count: 0,
          currentPower: function() { return getActualPower(this.basePower, this.count, this.maxLevel); } },
        { id: 'auto5', name: 'Мега-Директор', desc: '+500/сек', type: 'auto', baseCost: 250000, basePower: 500, maxLevel: 6, emoji: '👑', count: 0,
          currentPower: function() { return getActualPower(this.basePower, this.count, this.maxLevel); } },
        { id: 'click5', name: 'Легендарный Макс', desc: '+300 к клику', type: 'click', baseCost: 150000, basePower: 300, maxLevel: 6, emoji: '⭐', count: 0,
          currentPower: function() { return getActualPower(this.basePower, this.count, this.maxLevel); } }
    ];

    function getActualPower(basePower, level, maxLevel) {
        if (level <= DIMINISH_START) return basePower;
        return Math.floor(basePower * 0.5);
    }

    function recalcClickPower() {
        let total = 1;
        for(let up of upgrades) {
            if(up.type === 'click') {
                total += up.currentPower();
            }
        }
        clickPower = total;
        return clickPower;
    }

    function getCost(upgrade) {
        let multiplier = upgrade.count >= DIMINISH_START ? 0.7 : 1;
        return Math.floor(upgrade.baseCost + (upgrade.count * upgrade.baseCost * 0.4 * multiplier));
    }

    function formatNumber(num) {
        if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
        if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
        return Math.floor(num).toString();
    }

    // РАБОТА С ТАБЛИЦЕЙ ЛИДЕРОВ (localStorage)
    function getLeaderboard() {
        const leaderboard = localStorage.getItem('oarmm_leaderboard');
        if (!leaderboard) return [];
        try {
            return JSON.parse(leaderboard);
        } catch(e) {
            return [];
        }
    }

    function saveLeaderboard(leaderboard) {
        leaderboard.sort((a, b) => b.money - a.money);
        leaderboard = leaderboard.slice(0, 50); // Храним топ 50
        localStorage.setItem('oarmm_leaderboard', JSON.stringify(leaderboard));
    }

    function updateLeaderboard() {
        const leaderboard = getLeaderboard();
        const existingIndex = leaderboard.findIndex(p => p.id === playerId);
        
        const playerData = {
            id: playerId,
            name: playerName,
            money: money,
            clicks: totalClicks,
            timestamp: Date.now()
        };
        
        if (existingIndex !== -1) {
            leaderboard[existingIndex] = playerData;
        } else {
            leaderboard.push(playerData);
        }
        
        saveLeaderboard(leaderboard);
    }

    function getPlayerRank() {
        const leaderboard = getLeaderboard();
        const sorted = [...leaderboard].sort((a, b) => b.money - a.money);
        const rank = sorted.findIndex(p => p.id === playerId) + 1;
        return rank > 0 ? rank : '-';
    }

    function displayLeaderboard() {
        const leaderboard = getLeaderboard();
        const sorted = [...leaderboard].sort((a, b) => b.money - a.money);
        const container = document.getElementById('leaderboardList');
        
        if (sorted.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:20px;">Пока нет игроков. Будьте первым!</div>';
            return;
        }
        
        container.innerHTML = '';
        sorted.forEach((player, index) => {
            const rank = index + 1;
            const isCurrentPlayer = player.id === playerId;
            const item = document.createElement('div');
            item.className = `leaderboard-item ${isCurrentPlayer ? 'current-player' : ''}`;
            if (rank === 1) item.classList.add('top1');
            if (rank === 2) item.classList.add('top2');
            if (rank === 3) item.classList.add('top3');
            
            let medal = '';
            if (rank === 1) medal = '🥇';
            else if (rank === 2) medal = '🥈';
            else if (rank === 3) medal = '🥉';
            else medal = `${rank}`;
            
            item.innerHTML = `
                <div class="rank">${medal}</div>
                <div class="player-name">${player.name} ${isCurrentPlayer ? '(вы)' : ''}</div>
                <div class="player-money">💰 ${formatNumber(player.money)}</div>
            `;
            container.appendChild(item);
        });
        
        document.getElementById('updateInfo').innerHTML = `Обновлено: ${new Date().toLocaleTimeString()} | Всего игроков: ${sorted.length}`;
    }

    function showLeaderboard() {
        updateLeaderboard();
        displayLeaderboard();
        document.getElementById('leaderboardModal').classList.add('active');
    }

    function closeLeaderboard() {
        document.getElementById('leaderboardModal').classList.remove('active');
    }

    function showNotification(text, isError = false) {
        const notification = document.createElement('div');
        notification.className = 'notification';
        notification.style.background = isError ? 'linear-gradient(135deg, #FF4444, #CC0000)' : 'linear-gradient(135deg, #FFD700, #FFA500)';
        notification.style.color = isError ? 'white' : '#1a1a2e';
        notification.innerText = text;
        document.body.appendChild(notification);
        setTimeout(() => notification.remove(), 2500);
    }

    function saveGame() {
        const saveData = {
            version: '4.0',
            timestamp: Date.now(),
            money: money,
            clickPower: clickPower,
            totalClicks: totalClicks,
            upgrades: upgrades.map(up => ({ id: up.id, count: up.count }))
        };
        localStorage.setItem('makeMore_leaderboard_save', JSON.stringify(saveData));
        updateLeaderboard();
        showNotification('💾 Игра сохранена!', false);
    }

    function loadGame() {
        const saved = localStorage.getItem('makeMore_leaderboard_save');
        if (!saved) {
            showNotification('❌ Нет сохранений!', true);
            return false;
        }
        try {
            const data = JSON.parse(saved);
            money = data.money;
            totalClicks = data.totalClicks || 0;
            
            if(data.upgrades && data.upgrades.length === upgrades.length) {
                for(let i = 0; i < upgrades.length; i++) {
                    upgrades[i].count = data.upgrades[i].count;
                }
            }
            
            recalcClickPower();
            updateUI();
            updateLeaderboard();
            showNotification(`📂 Загружено! Капитал: ${formatNumber(money)}`, false);
            return true;
        } catch(e) {
            showNotification('❌ Ошибка загрузки!', true);
            return false;
        }
    }

    function updateUI() {
        document.getElementById('balance').innerText = formatNumber(money);
        document.getElementById('perClick').innerText = clickPower;
        document.getElementById('totalClicks').innerText = totalClicks;
        
        let autoIncome = 0;
        let totalLevels = 0;
        let maxPossibleLevels = 0;
        let hiredCount = 0;
        
        for(let up of upgrades) {
            if(up.type === 'auto') {
                autoIncome += up.currentPower() * up.count;
            }
            totalLevels += up.count;
            maxPossibleLevels += up.maxLevel;
            if(up.count > 0) hiredCount++;
        }
        
        const progressPercent = maxPossibleLevels > 0 ? Math.floor((totalLevels / maxPossibleLevels) * 100) : 0;
        document.getElementById('autoIncome').innerText = autoIncome;
        document.getElementById('progressPercent').innerText = progressPercent + '%';
        document.getElementById('totalHired') && (document.getElementById('totalHired').innerText = `${hiredCount}/${upgrades.length}`);
        
        const rank = getPlayerRank();
        document.getElementById('playerRank').innerText = rank === '-' ? '-' : rank + ' место';
        
        const container = document.getElementById('upgradesList');
        container.innerHTML = '';
        
        for(let up of upgrades) {
            const cost = getCost(up);
            const isMaxed = up.count >= up.maxLevel;
            const canBuy = money >= cost && !isMaxed;
            const currentPowerValue = up.currentPower();
            const isDiminishing = up.count >= DIMINISH_START && up.count < up.maxLevel;
            
            const div = document.createElement('div');
            div.className = `upgrade ${isMaxed ? 'max-level' : ''}`;
            
            let powerDisplay = `${currentPowerValue}`;
            let powerClass = '';
            
            if (isMaxed) {
                powerDisplay = `MAX ${currentPowerValue}`;
            } else if (isDiminishing) {
                powerDisplay = `${currentPowerValue} (было ${up.basePower})`;
                powerClass = 'diminishing';
            }
            
            div.innerHTML = `
                <div class="upgrade-info">
                    <div class="upgrade-name">${up.emoji} ${up.name}</div>
                    <div class="upgrade-desc">+${up.desc}</div>
                    <div class="upgrade-stats ${powerClass}">
                        📊 ур.${up.count}/${up.maxLevel} | +${powerDisplay}
                    </div>
                </div>
                <div class="upgrade-cost">💰 ${isMaxed ? 'MAX' : formatNumber(cost)}</div>
                <button class="buy-btn ${isMaxed ? 'maxed' : (canBuy ? '' : 'disabled')}" 
                        data-id="${up.id}" ${isMaxed ? 'disabled' : ''}>
                    ${isMaxed ? '👑 MAX' : 'Нанять'}
                </button>
            `;
            container.appendChild(div);
        }

        document.querySelectorAll('.buy-btn').forEach(btn => {
            if (btn.disabled) return;
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = btn.getAttribute('data-id');
                const upgrade = upgrades.find(u => u.id === id);
                if(upgrade) buyUpgrade(upgrade);
            });
        });
    }

    function buyUpgrade(upgrade) {
        if (upgrade.count >= upgrade.maxLevel) {
            showNotification(`👑 ${upgrade.name} уже на максимальном уровне!`, true);
            return;
        }
        
        const cost = getCost(upgrade);
        if(money >= cost) {
            money -= cost;
            upgrade.count++;
            
            const newPower = upgrade.currentPower();
            const isDiminishing = upgrade.count >= DIMINISH_START;
            const isMax = upgrade.count === upgrade.maxLevel;
            
            if (isMax) {
                showNotification(`👑 ПОЗДРАВЛЯЮ! ${upgrade.name} достиг МАКСИМАЛЬНОГО уровня!`, false);
            } else if (isDiminishing && upgrade.count === DIMINISH_START) {
                showNotification(`⚠️ ${upgrade.name} достиг ${DIMINISH_START} уровня! Эффективность снижена!`, false);
            } else {
                showNotification(`✅ ${upgrade.name} улучшен до ${upgrade.count} уровня!`, false);
            }
            
            if(upgrade.type === 'click') recalcClickPower();
            
            updateUI();
            saveGame();
            showFloatingText(`Ур.${upgrade.count}`, document.getElementById('clickBtn'));
        } else {
            const btn = document.querySelector(`.buy-btn[data-id="${upgrade.id}"]`);
            if(btn) {
                btn.classList.add('shake');
                setTimeout(() => btn.classList.remove('shake'), 200);
            }
            showNotification(`❌ Не хватает ${formatNumber(cost - money)} монет`, true);
        }
    }

    function handleClick() {
        money += clickPower;
        totalClicks++;
        updateUI();
        showFloatingText(`+${clickPower}`, document.getElementById('clickBtn'));
        const btn = document.getElementById('clickBtn');
        btn.style.transform = 'scale(0.96)';
        setTimeout(() => btn.style.transform = '', 80);
    }

    function showFloatingText(text, originElement) {
        const rect = originElement.getBoundingClientRect();
        const div = document.createElement('div');
        div.className = 'floating-number';
        div.innerText = text;
        div.style.left = (rect.left + rect.width / 2 - 20) + 'px';
        div.style.top = (rect.top - 20) + 'px';
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 700);
    }

    let autoIncomeInterval = null;
    
    function startAutoIncome() {
        if(autoIncomeInterval) clearInterval(autoIncomeInterval);
        autoIncomeInterval = setInterval(() => {
            let autoMoney = 0;
            for(let up of upgrades) {
                if(up.type === 'auto') {
                    autoMoney += up.currentPower() * up.count;
                }
            }
            if(autoMoney > 0) {
                money += autoMoney;
                updateUI();
            }
        }, 1000);
    }

    function resetGame() {
        if(confirm('💀 НАЧАТЬ ВСЁ ЗАНОВО? Ваше место в таблице лидеров обновится! 💀')) {
            money = 0;
            totalClicks = 0;
            for(let up of upgrades) {
                up.count = 0;
            }
            recalcClickPower();
            updateUI();
            updateLeaderboard();
            saveGame();
            showNotification('🔄 Игра перезапущена!');
        }
    }

    // Автообновление таблицы лидеров каждые 30 секунд
    setInterval(() => {
        if (money > 0) {
            updateLeaderboard();
            const rank = getPlayerRank();
            document.getElementById('playerRank').innerText = rank === '-' ? '-' : rank + ' место';
        }
    }, 30000);

    function init() {
        loadGame();
        recalcClickPower();
        updateUI();
        startAutoIncome();
        
        document.getElementById('clickBtn').addEventListener('click', handleClick);
        document.getElementById('saveBtn').addEventListener('click', saveGame);
        document.getElementById('loadBtn').addEventListener('click', loadGame);
        document.getElementById('resetBtn').addEventListener('click', resetGame);
        document.getElementById('leaderboardBtn').addEventListener('click', showLeaderboard);
        
        window.addEventListener('beforeunload', () => {
            updateLeaderboard();
            saveGame();
        });
        
        setTimeout(() => {
            showNotification('🏆 Соревнуйтесь с другими игроками в таблице лидеров!');
        }, 500);
    }

    init();
</script>
</body>
</html>
